groups:
  - name: 数学
    text: 集合位相論や線形代数など、データ分析の土台となる数学を学んでいます。社会問題を数理モデルで表し、解決につなげることを目指しています。
    items:
      - 集合位相論
      - 微分積分学
      - 線形代数学
      - 統計学
      - 離散数学
  - name: データサイエンス
    text: データの前処理から統計解析、機械学習モデルの構築まで取り組んでいます。研究と実務の両方で、課題に合った分析を提案できるようにしていきたいです。
    items:
      - データ分析
      - 統計解析
      - 統計モデリング
      - 機械学習
      - 深層学習
  - name: プログラミング
    text: Pythonを中心に、データ分析や機械学習のコードを書いています。HTML・CSS・JavaScriptは、Webページの制作に使っています。
    items:
      - Python
      - HTML / CSS
      - JavaScript
  - name: ツール
    text: GitHubでコードを管理し、NotionやGoogleのサービスで情報やタスクを整理しています。チームでの共同作業を円滑に進めるために活用しています。
    items:
      - GitHub
      - Notion
      - Google関連サービス
  - name: 経営・会計
    text: 共同創業したAvisの副代表として、経理・人事・システムなどのバックオフィスを担っています。数字と仕組みの両面から組織を支えていきたいです。
    items:
      - 会社経営(共同創業・副代表)
      - 簿記
      - 会計知識
  - name: 教育
    text: 高校在学中から大学まで、塾講師として通算約6年、個別指導に携わってきました。相手に合わせて分かりやすく伝える力は、研究発表や仕事にも活かしています。
    items:
      - 個別指導(塾講師 通算約6年)

